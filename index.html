<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoCreate - Red de Creadores</title>
  <style>
    :root {
      --bg-dark: #0f1015;
      --accent: #ccff00;
      --text: #ffffff;
      --card-bg: #181920;
      --border: #2a2b36;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 16, 21, 0.9);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
    }
    .logo span {
      color: var(--accent);
    }
    .btn-publish {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 10px 22px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-publish:hover { opacity: 0.9; }
    .hero {
      padding: 50px 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(204,255,0,0.03) 0%, rgba(15,16,21,0) 100%);
    }
    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }
    .hero h1 span {
      color: var(--accent);
    }
    .hero p {
      color: #999;
      font-size: 1.05rem;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }
    .project-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .card-banner {
      height: 120px;
      background-size: cover;
      background-position: center;
      background-color: #222;
    }
    .card-body {
      padding: 24px;
    }
    .card-profile-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: -55px;
      margin-bottom: 15px;
    }
    .card-avatar {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 4px solid var(--card-bg);
      object-fit: cover;
      background-color: #333;
    }
    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-action:hover { border-color: var(--accent); color: var(--accent); }
    .btn-action.report { border-color: #552222; color: #ff6b6b; }
    
    /* Modales */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #14151b;
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 450px;
      border: 1px solid var(--border);
    }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: #0f1015;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 10px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .modal-content input:focus, .modal-content textarea:focus {
      border-color: var(--accent);
      outline: none;
    }
    .loading-state, .error-state {
      text-align: center;
      padding: 40px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">CoCreate<span>.</span></div>
    <button class="btn-publish" onclick="toggleModal('modalPublish', true)">+ Publicar</button>
  </header>

  <div class="hero">
    <h1>Crea. Conecta. <span>Colabora.</span></h1>
    <p>La plataforma para creadores de contenido y videojugadores.</p>
  </div>

  <div class="container" id="projectsGrid">
    <div class="loading-state">Cargando publicaciones...</div>
  </div>

  <!-- Modal Publicar -->
  <div id="modalPublish" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Crear Publicación</h3>
      <form id="projectForm" onsubmit="submitProject(event)">
        <input type="text" id="inputUser" placeholder="Tu nombre o canal" required>
        <input type="text" id="inputAvatar" placeholder="URL de tu foto de perfil (Imagen)" required>
        <input type="text" id="inputBanner" placeholder="URL de tu imagen de Banner" required>
        <textarea id="inputBio" placeholder="Breve biografía..." rows="2" required></textarea>
        <hr style="border-color:var(--border); margin:15px 0;">
        <input type="text" id="inputTitle" placeholder="Título de tu proyecto o video" required>
        <input type="text" id="inputVideo" placeholder="Link de YouTube (ej: https://youtube.com/watch?v=...)">
        <select id="inputCategory">
          <option value="Gaming & Free Fire">Gaming & Free Fire</option>
          <option value="Cine & Video">Cine & Video</option>
          <option value="Música">Música</option>
          <option value="Tech">Tech</option>
        </select>
        <textarea id="inputDesc" placeholder="Describe lo que buscas colaborar..." rows="3" required></textarea>
        <button type="submit" class="btn-publish" style="width:100%; margin-top:5px;">Publicar ahora</button>
        <button type="button" onclick="toggleModal('modalPublish', false)" style="background:none; border:none; color:#777; width:100%; margin-top:15px; cursor:pointer;">Cancelar</button>
      </form>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://nzbyrngkyzcswojuplqs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_zQ0xEAPIznA06JoJjRuaQ_SZib1rJt';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function toggleModal(modalId, show) {
      document.getElementById(modalId).style.display = show ? 'flex' : 'none';
    }

    async function submitProject(e) {
      e.preventDefault();
      const user = document.getElementById('inputUser').value;
      const avatar = document.getElementById('inputAvatar').value;
      const banner = document.getElementById('inputBanner').value;
      const bio = document.getElementById('inputBio').value;
      const title = document.getElementById('inputTitle').value;
      const video_link = document.getElementById('inputVideo').value;
      const category = document.getElementById('inputCategory').value;
      const desc = document.getElementById('inputDesc').value;

      const { error } = await supabase.from('projects').insert([{ 
        user, avatar, banner, bio, title, video_link, category, desc, points: 10, rating: 5 
      }]);
      
      if (error) {
        alert('Error al publicar: ' + error.message);
      } else {
        alert('¡Publicado con éxito!');
        document.getElementById('projectForm').reset();
        toggleModal('modalPublish', false);
        loadProjects();
      }
    }

    async function deleteProject(id) {
      if (confirm("¿Estás seguro de eliminar esta publicación?")) {
        const { error } = await supabase.from('projects').delete().eq('id', id);
        if (!error) {
          loadProjects();
        } else {
          alert("Error al eliminar: " + error.message);
        }
      }
    }

    async function loadProjects() {
      const grid = document.getElementById('projectsGrid');
      const { data, error } = await supabase.from('projects').select('*').order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = `<div class="error-state">Error al conectar con la base de datos.<br><small>${error.message}</small></div>`;
        return;
      }

      if (!data || data.length === 0) {
        grid.innerHTML = `<div class="loading-state">No hay publicaciones todavía. ¡Sé el primero en publicar arriba!</div>`;
        return;
      }

      grid.innerHTML = '';
      data.forEach(p => {
        let videoEmbed = '';
        if (p.video_link) {
          let videoId = '';
          if (p.video_link.includes('v=')) {
            videoId = p.video_link.split('v=')[1].split('&')[0];
          } else if (p.video_link.includes('youtu.be/')) {
            videoId = p.video_link.split('youtu.be/')[1].split('?')[0];
          }
          if (videoId) {
            videoEmbed = `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen style="border-radius:10px; margin-top:12px;"></iframe>`;
          }
        }

        grid.innerHTML += `
          <div class="project-card">
            <div class="card-banner" style="background-image: url('${p.banner || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600'}');"></div>
            <div class="card-body">
              <div class="card-profile-row">
                <img src="${p.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + p.user}" class="card-avatar">
                <div>
                  <div style="font-weight:700; font-size:1.05rem; color:var(--text);">${p.user}</div>
                  <div style="font-size:0.8rem; color:#888;">${p.bio || 'Creador de contenido'}</div>
                </div>
              </div>
              <span style="background:#0f1015; border:1px solid var(--border); padding:3px 10px; font-size:0.75rem; border-radius:6px; color:#aaa;">${p.category || 'General'}</span>
              <h3 style="margin:12px 0 6px 0; font-size:1.2rem;">${p.title}</h3>
              ${videoEmbed}
              <p style="color:#aaa; font-size:0.92rem; line-height:1.4; margin-top:10px;">${p.desc}</p>
              
              <div class="card-actions">
                <button class="btn-action report" onclick="deleteProject(${p.id})">Eliminar</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    loadProjects();
  </script>
</body>
</html>
